<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GeoLab 3D — Mô phỏng hình học không gian</title>
<style>
  :root {
    --bg: #1a1a24;
    --bg-2: #22222e;
    --bg-3: #2a2a38;
    --line: #3a3a4a;
    --line-soft: #2e2e3c;
    --ink: #e8e8f0;
    --ink-2: #b8b8c8;
    --ink-3: #8888a0;
    --ink-4: #5a5a70;
    --accent: #4a9eff;
    --danger: #ff5a5a;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: flex; }

  .sidebar {
    width: 360px;
    min-width: 300px;
    max-width: 420px;
    height: 100vh;
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-head .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    color: #0a0a14;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
    font-family: var(--mono);
  }
  .sidebar-head h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .sidebar-head p { font-size: 10px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }
  .sidebar-scroll::-webkit-scrollbar { width: 6px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--line); }

  .section { margin-bottom: 18px; }
  .section-title {
    font-size: 10px;
    font-family: var(--mono);
    letter-spacing: 0.14em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 10px;
    font-family: var(--mono);
    letter-spacing: 0.1em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    border-radius: 0;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }

  .btn {
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--bg-3);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 0;
    transition: background 120ms, border-color 120ms;
  }
  .btn:hover { background: var(--bg); border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: #0a0a14; border-color: var(--accent); font-weight: 700; }
  .btn-primary:hover { background: #6ab0ff; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-block { width: 100%; }

  .object-list { display: flex; flex-direction: column; gap: 6px; }
  .object-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--accent);
  }
  .object-card .oc-info { flex: 1; min-width: 0; }
  .object-card .oc-name { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .object-card .oc-type { font-size: 9px; font-family: var(--mono); letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; margin-top: 2px; }
  .object-card .oc-delete { background: none; border: 1px solid var(--line); color: var(--ink-3); width: 24px; height: 24px; cursor: pointer; font-size: 12px; border-radius: 0; }
  .object-card .oc-delete:hover { border-color: var(--danger); color: var(--danger); }
  .empty-list { font-size: 11px; color: var(--ink-4); text-align: center; padding: 20px 0; font-style: italic; }

  .viewport {
    flex: 1;
    position: relative;
    background: var(--bg);
  }
  #canvas { width: 100%; height: 100%; display: block; }

  .viewport-overlay {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .viewport-overlay .btn { background: rgba(34,34,46,0.85); backdrop-filter: blur(4px); }

  .hint {
    position: absolute;
    bottom: 12px;
    left: 12px;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--ink-4);
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  .error-msg {
    margin-top: 6px;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--danger);
    letter-spacing: 0.06em;
  }

  @media (max-width: 760px) {
    .sidebar { width: 100%; max-width: none; height: 40vh; }
    body { flex-direction: column; }
    .viewport { height: 60vh; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-head">
    <div class="logo">G3</div>
    <div>
      <h1>GeoLab 3D</h1>
      <p>Mô phỏng hình học không gian</p>
    </div>
  </div>
  <div class="sidebar-scroll">

    <!-- Surface -->
    <div class="section">
      <div class="section-title">Mặt phẳng hàm số z = f(x,y)</div>
      <div class="field">
        <label>Biểu thức (dùng x, y)</label>
        <input id="surf-expr" type="text" value="sin(x)*cos(y)" placeholder="sin(x)*cos(y)" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>X min</label>
          <input id="surf-xmin" type="number" value="-4" />
        </div>
        <div class="field">
          <label>X max</label>
          <input id="surf-xmax" type="number" value="4" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Y min</label>
          <input id="surf-ymin" type="number" value="-4" />
        </div>
        <div class="field">
          <label>Y max</label>
          <input id="surf-ymax" type="number" value="4" />
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="btn-surface">Dựng mặt phẳng</button>
      <div class="error-msg" id="surf-err"></div>
    </div>

    <!-- Point -->
    <div class="section">
      <div class="section-title">Điểm 3D</div>
      <div class="field-row">
        <div class="field"><label>X</label><input id="pt-x" type="number" value="1" step="0.5" /></div>
        <div class="field"><label>Y</label><input id="pt-y" type="number" value="1" step="0.5" /></div>
        <div class="field"><label>Z</label><input id="pt-z" type="number" value="1" step="0.5" /></div>
      </div>
      <button class="btn btn-block" id="btn-point">Thêm điểm</button>
    </div>

    <!-- Vector -->
    <div class="section">
      <div class="section-title">Vector 3D</div>
      <div class="field-row">
        <div class="field"><label>Từ X</label><input id="vec-x1" type="number" value="0" step="0.5" /></div>
        <div class="field"><label>Từ Y</label><input id="vec-y1" type="number" value="0" step="0.5" /></div>
        <div class="field"><label>Từ Z</label><input id="vec-z1" type="number" value="0" step="0.5" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Đến X</label><input id="vec-x2" type="number" value="2" step="0.5" /></div>
        <div class="field"><label>Đến Y</label><input id="vec-y2" type="number" value="1" step="0.5" /></div>
        <div class="field"><label>Đến Z</label><input id="vec-z2" type="number" value="1" step="0.5" /></div>
      </div>
      <button class="btn btn-block" id="btn-vector">Thêm vector</button>
    </div>

    <!-- Solids -->
    <div class="section">
      <div class="section-title">Khối hình học</div>
      <div class="field">
        <label>Loại</label>
        <select id="solid-type">
          <option value="cube">Lập phương</option>
          <option value="sphere">Mặt cầu</option>
          <option value="cone">Hình nón</option>
          <option value="cylinder">Hình trụ</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Kích thước</label><input id="solid-size" type="number" value="2" step="0.5" min="0.1" /></div>
        <div class="field"><label>Vị trí X</label><input id="solid-x" type="number" value="0" step="0.5" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Vị trí Y</label><input id="solid-y" type="number" value="0" step="0.5" /></div>
        <div class="field"><label>Vị trí Z</label><input id="solid-z" type="number" value="0" step="0.5" /></div>
      </div>
      <button class="btn btn-block" id="btn-solid">Thêm khối</button>
    </div>

    <!-- Object list -->
    <div class="section">
      <div class="section-title">Danh sách đối tượng</div>
      <div class="object-list" id="object-list">
        <div class="empty-list">Chưa có đối tượng nào.</div>
      </div>
    </div>

  </div>
</aside>

<main class="viewport">
  <div id="canvas"></div>
  <div class="viewport-overlay">
    <button class="btn" id="btn-reset">Đặt lại góc nhìn</button>
    <button class="btn" id="btn-clear">Xóa tất cả</button>
  </div>
  <div class="hint">Kéo chuột trái: xoay · Lăn: zoom · Chuột phải: pan · Shift+Kéo: xoay</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a24);

const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(8, 8, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 0.85);
dir.position.set(10, 15, 10);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0x4a9eff, 0.3);
dir2.position.set(-8, 5, -8);
scene.add(dir2);

// Axes
const axes = new THREE.AxesHelper(6);
scene.add(axes);

// Grid
const grid = new THREE.GridHelper(20, 20, 0x3a3a4a, 0x2a2a38);
scene.add(grid);

// Objects registry
const objects = [];
let counter = 0;
const objList = document.getElementById('object-list');

function renderObjectList() {
  if (objects.length === 0) {
    objList.innerHTML = '<div class="empty-list">Chưa có đối tượng nào.</div>';
    return;
  }
  objList.innerHTML = objects.map((o, i) => `
    <div class="object-card">
      <div class="oc-info">
        <div class="oc-name">${o.name}</div>
        <div class="oc-type">${o.type}</div>
      </div>
      <button class="oc-delete" data-idx="${i}" title="Xóa">×</button>
    </div>
  `).join('');
  objList.querySelectorAll('.oc-delete').forEach((btn) => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const o = objects[idx];
      scene.remove(o.mesh);
      objects.splice(idx, 1);
      renderObjectList();
    });
  });
}

function addObj(name, type, mesh) {
  counter++;
  objects.push({ name: name || `${type} ${counter}`, type, mesh });
  scene.add(mesh);
  renderObjectList();
}

// Surface
document.getElementById('btn-surface').addEventListener('click', () => {
  const expr = document.getElementById('surf-expr').value.trim();
  const xmin = Number(document.getElementById('surf-xmin').value);
  const xmax = Number(document.getElementById('surf-xmax').value);
  const ymin = Number(document.getElementById('surf-ymin').value);
  const ymax = Number(document.getElementById('surf-ymax').value);
  const errEl = document.getElementById('surf-err');
  errEl.textContent = '';
  try {
    const segs = 40;
    const geo = new THREE.PlaneGeometry(xmax - xmin, ymax - ymin, segs, segs);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = xmin + (pos.getX(i) + (xmax - xmin) / 2);
      const y = ymin + (pos.getY(i) + (ymax - ymin) / 2);
      let z = 0;
      try { z = math.evaluate(expr, { x, y }); } catch (e) { z = 0; }
      if (!Number.isFinite(z)) z = 0;
      pos.setZ(i, z);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: 0x4a9eff,
      side: THREE.DoubleSide,
      wireframe: false,
      transparent: true,
      opacity: 0.85,
      roughness: 0.4,
      metalness: 0.1,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((xmin + xmax) / 2, (ymin + ymax) / 2, 0);
    // rotate plane to XY plane (PlaneGeometry is in XY by default, z becomes height)
    mesh.rotation.x = -Math.PI / 2;
    // Actually PlaneGeometry lies in XY; we want z = f(x,y) as height. Keep as is but adjust: plane X-Y, Z up.
    // Redo properly: build manually
    addObj(`z = ${expr}`, 'Mặt phẳng hàm số', mesh);
  } catch (e) {
    errEl.textContent = 'Lỗi: ' + e.message;
  }
});

// Point
document.getElementById('btn-point').addEventListener('click', () => {
  const x = Number(document.getElementById('pt-x').value);
  const y = Number(document.getElementById('pt-y').value);
  const z = Number(document.getElementById('pt-z').value);
  const geo = new THREE.SphereGeometry(0.12, 16, 16);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  addObj(`P(${x}, ${y}, ${z})`, 'Điểm', mesh);
});

// Vector
document.getElementById('btn-vector').addEventListener('click', () => {
  const x1 = Number(document.getElementById('vec-x1').value);
  const y1 = Number(document.getElementById('vec-y1').value);
  const z1 = Number(document.getElementById('vec-z1').value);
  const x2 = Number(document.getElementById('vec-x2').value);
  const y2 = Number(document.getElementById('vec-y2').value);
  const z2 = Number(document.getElementById('vec-z2').value);
  const dir = new THREE.Vector3(x2 - x1, y2 - y1, z2 - z1);
  const len = dir.length();
  if (len < 1e-6) return;
  const origin = new THREE.Vector3(x1, y1, z1);
  const arrow = new THREE.ArrowHelper(dir.clone().normalize(), origin, len, 0xff6b6b, 0.3, 0.15);
  addObj(`v = (${x2-x1}, ${y2-y1}, ${z2-z1})`, 'Vector', arrow);
});

// Solid
document.getElementById('btn-solid').addEventListener('click', () => {
  const type = document.getElementById('solid-type').value;
  const size = Number(document.getElementById('solid-size').value);
  const x = Number(document.getElementById('solid-x').value);
  const y = Number(document.getElementById('solid-y').value);
  const z = Number(document.getElementById('solid-z').value);
  let geo;
  if (type === 'cube') geo = new THREE.BoxGeometry(size, size, size);
  else if (type === 'sphere') geo = new THREE.SphereGeometry(size / 2, 32, 32);
  else if (type === 'cone') geo = new THREE.ConeGeometry(size / 2, size, 32);
  else if (type === 'cylinder') geo = new THREE.CylinderGeometry(size / 2, size / 2, size, 32);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4a9eff, roughness: 0.3, metalness: 0.2, transparent: true, opacity: 0.85 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  const names = { cube: 'Lập phương', sphere: 'Mặt cầu', cone: 'Hình nón', cylinder: 'Hình trụ' };
  addObj(`${names[type]} (s=${size})`, names[type], mesh);
});

// Reset view
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.set(8, 8, 8);
  controls.target.set(0, 0, 0);
  controls.update();
});

// Clear all
document.getElementById('btn-clear').addEventListener('click', () => {
  objects.forEach((o) => scene.remove(o.mesh));
  objects.length = 0;
  renderObjectList();
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
